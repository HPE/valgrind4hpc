---
# hosts.yaml
#
# "database" mapping machine names to machine qualities. used when the remote
# test tool finds hosts and generates reports

# describes the available fields for a host entry. used by the tool to validate
# loaded values. each field is a list of valid values for that field in a host
# entry.
SCHEMA:
  hostname: foo # optional - resolvable hostname - useful for e.g. uans with only ip addresses
  cwd: ~/tmp # optional - at test time, run tests here instead of the default location (listed here)
  wlm:
  - slurm
  - pals
  type:
  - xc
  - apollo
  - cs
  - everest
  - shasta13
  - shasta13
  - shasta15
  - shasta15
  shasta-type: # optional - for shasta machines
  - ncn # need to create a uai first
  - uan # can run jobs without creating a uai
  os:
  - sles15
  - sles15sp1
  - sles15sp2
  - sles15sp3
  - rhel80
  - rhel81
  - rhel83
  - rhel84
  - rhel85
  arch:
    - x86
    - aarch

